name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check the web script
        run: node --check Jellyfin.Plugin.WatchParty/Web/watchparty.js
      - name: Build
        run: dotnet publish Jellyfin.Plugin.WatchParty -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.WatchParty
          path: |
            out/Jellyfin.Plugin.WatchParty.dll
            meta.json
